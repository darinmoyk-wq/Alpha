# Base44 sandbox environment for "AWS AI - Autonomous Cloud Engineer".
# Single Node service: Vite dev server (port 3000) with the Express API mounted
# as middleware from server/api.ts. Runs from the cloned source, never a build.
services:
  web:
    image: node:22-bookworm-slim
    labels:
      base44.project: "AWS AI - Autonomous Cloud Engineer"
      base44.kind: "web"
      base44.port: "3000"
    working_dir: /app
    # Dependencies live in a named volume, so install on startup from the mounted
    # manifest, then exec the dev server (live reload, no image rebuild on edits).
    command:
      - sh
      - -ec
      - |
        npm install --no-audit --no-fund
        exec npm run dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      - BASE44_PREVIEW_MODE
      # Vite >= 6.1 appends this to its allowed hosts (preview proxy hostname).
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    env_file:
      # Platform-managed secrets (GEMINI_API_KEY). Optional: without it the API
      # answers from the deterministic Autonomy Matrix engine.
      - /run/base44/app.env
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    restart: on-failure

volumes:
  node_modules:

services:
  web:
    image: node:22
    working_dir: /app
    labels:
      base44.project: "AWS AI"
      base44.kind: "web"
      base44.port: "3000"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
    environment:
      - NODE_ENV=development
      - BASE44_PREVIEW_MODE
      # Vite (>= 6.1) appends this to server.allowedHosts so the preview proxy host is accepted.
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - BASE44_PUBLIC_HOST_SUFFIX
      - BASE44_SANDBOX_HOST_DOMAIN
      # Bind mounts on the sandbox do not always emit inotify events.
      - CHOKIDAR_USEPOLLING=1
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    command: ["sh", "-ec", "npm install --no-audit --no-fund && exec npm run dev"]
    restart: on-failure
    healthcheck:
      # Serves the React app and mounts the API middleware in the same process — probe both.
      test:
        - CMD
        - node
        - -e
        - |
          Promise.all([
            fetch('http://127.0.0.1:3000/'),
            fetch('http://127.0.0.1:3000/api/health'),
          ]).then((rs) => {
            const bad = rs.map((r) => r.ok).filter((ok) => !ok);
            if (bad.length) { console.error('unhealthy: ' + bad.length + ' check(s) failed'); process.exit(1); }
            process.exit(0);
          }).catch((e) => { console.error('healthcheck error: ' + e.message); process.exit(1); });
      interval: 15s
      timeout: 8s
      start_period: 120s
      retries: 5
